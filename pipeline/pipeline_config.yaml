  default_author: null
  default_language: null
  cookie_lang: null
  amp_mode: "none"
  verify_ssl: true
  noise_language: ["common", "ru"]

  auto_detect_family:
    enabled: true
    scan_pages: 3
    confidence_threshold: 2
    families:

      np_widget:
        indicators:
          - selector: "div.np-widget-rubric"
            weight: 3
          - selector: "div.page-main__text"
            weight: 2
          - selector: "li.newsList__item"
            weight: 2
          - selector: "li.all-news__list"
            weight: 2
          - url_pattern: "/news/rubric/list/"
            weight: 2
        match_min_score: 4
        profile:
          rubric_selectors:
            - "div.np-widget-rubric a[href]"
            - "a.main-menu__link[href*='/news/rubric/']"
            - "a.menu-list__link[href*='/news/rubric/list/']"
