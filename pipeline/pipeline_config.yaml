            - "li.all-news__list"
            - "li.tm-news-list__item"
            - "ul.list li.list__item"
            - "li.news-list__item"
          card_exclude_classes:
            - "banner"
            - "_more"
            - "ad"
          article_link_selectors:
            - "a.newsList__item-text"
            - "a.all-news__list__link"
            - "a.tm-news-list__item-link"
            - "a.list__link"
            - "a.news-list__link"
          title_selectors:
            - "h1.main__news-title"
            - "h1.single-page__title"
            - "h1.single__title"
            - 'meta[property="og:title"]'
            - "h1"
            - "title"
          date_selectors:
            - "a.main__date"
            - "time.news__item-date"
            - "span.list__date"
            - 'meta[property="article:published_time"]'
            - 'meta[itemprop="datePublished"]'
            - "time[datetime]"
          author_selectors:
            - ".single__author"
            - ".main__author"
            - 'meta[property="article:author"]'
            - 'meta[name="author"]'
