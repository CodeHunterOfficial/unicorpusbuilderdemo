# Universal config.yaml
version: "1.0"
name: "optimal_pipeline"
description: "Universal configurable scraper for multilingual news/listing/article sites"
site_count_expected: 28

global:
  start_url: "https://tatar-inform.tatar/"
  same_domain_only: true
  use_amp_fallback: true
  respect_robots: false
  colab_auto_download: false

  request:
    timeout: 25
    retries: 3
    backoff_base: 1.6
    default_delay_seconds: 1.2
    rubric_delay_range_seconds: [1.0, 2.2]
    max_threads: 8
    verify_ssl: true

  limits:
    max_depth: 3
    max_pages: 1000
    max_items: 10000
    excerpt_len: 260
    hash_truncate: 32

  url_rules:
    article_url_filters_default:
      - "/news/"
      - "/article/"
      - "/story/"
      - "/post/"
      - "/a/"
    article_url_excludes_default:
      - "/rubric/"
      - "/category/"
      - "/tag/"
      - "/widget/"
      - "/list/"
    noise_url_parts:
      - "/photo/"
      - "/video/"
      - "/special-projects/"
      - "/widget/"
      - "/tag/list/"
      - "vkvideo"
      - "youtube"
      - "youtu.be"
      - "instagram"
      - "facebook"
      - "telegram"
      - "ok.ru"
      - "/login"
      - "/signup"
      - "/signin"
      - "/register"
      - "/attachments/"
      - "/store/"
      - ".png"
      - ".jpg"
      - ".jpeg"
      - ".gif"
      - ".svg"
      - ".xml"
      - ".pdf"
      - ".zip"

  text_rules:
    normalize:
      lowercase: true
      trim: true
      remove_punctuation: false

    language_detection:
      enabled: true
      fallback: "unknown"

    noise_words:
      common:
        - "menu"
        - "search"
        - "home"
        - "next"
        - "previous"
        - "read more"
        - "load more"
        - "more"
        - "skip"
        - "close"

      ru:
        - "subscribe"
        - "sign in"
        - "registration"
        - "share"
        - "advertisement"
        - "cookies"
        - "cookie"
        - "menu"
        - "home"
        - "next"
        - "read more"
        - "comments"

      tt:
        - "subscribe"
        - "login"
        - "registration"
        - "share"
        - "advertisement"
        - "menu"
        - "home page"
        - "next"
        - "read more"

      ba:
        - "register"
        - "login"
        - "subscribe"
        - "share"
        - "advertisement"
        - "menu"
        - "home page"
        - "next"

      tg:
        - "subscribe"
        - "login"
        - "registration"
        - "share"
        - "advertisement"
        - "menu"
        - "home page"
        - "more"
        - "continue"

      uz:
        - "subscribe"
        - "login"
        - "registration"
        - "share"
        - "advertisement"
        - "menu"
        - "home page"
        - "more"
        - "continuation"

      en:
        - "subscribe"
        - "sign in"
        - "login"
        - "register"
        - "share"
        - "advertisement"
        - "cookie"
        - "comments"
        - "read more"

    stopwords:
      enabled: true
      per_language: true
      ru:
        - "and"
        - "in"
        - "on"
        - "with"
        - "by"
        - "what"
        - "this"
        - "how"
        - "to"
        - "from"
      tt:
        - "and"
        - "this"
        - "with"
        - "for"
        - "also"
      ba:
        - "and"
        - "he"
        - "with"
        - "for"
      tg:
        - "and"
        - "in"
        - "from"
        - "with"
        - "that"
      uz:
        - "and"
        - "this"
        - "for"
        - "also"
      en:
        - "the"
        - "is"
        - "at"
        - "which"
        - "on"

    filters:
      min_word_length: 2
      remove_numeric_only: true
      drop_if_only_noise: true
      min_text_length: 20
      deduplicate_lines: true

    patterns:
      ui_patterns:
        - "read.*"
        - "read.*"
        - "show.*"
        - "load.*"
      ad_patterns:
        - "advert"
        - "promo"
        - "sponsor"

  content_cleanup:
    remove_selectors:
      - "script"
      - "style"
      - "noscript"
      - "iframe"
      - "svg"
      - "form"
      - "button"
      - "canvas"

  meta_extraction:
    title_selectors_default:
      - 'meta[property="og:title"]'
      - 'meta[name="twitter:title"]'
      - "h1"
      - "title"
    date_selectors_default:
      - 'meta[property="article:published_time"]'
      - 'meta[name="pubdate"]'
      - 'meta[name="published_date"]'
      - 'meta[itemprop="datePublished"]'
      - 'meta[name="published_at"]'
      - "time[datetime]"
    author_selectors_default:
      - 'meta[property="article:author"]'
      - 'meta[name="author"]'
      - 'meta[name="Author"]'
    category_selectors_default:
      - 'meta[property="article:section"]'
      - 'meta[name="section"]'
      - ".breadcrumb a"
      - "nav.breadcrumb a"
    image_selectors_default:
      - 'meta[property="og:image"]'
      - 'meta[property="og:image:secure_url"]'
      - 'meta[name="twitter:image"]'
      - 'meta[name="twitter:image:src"]'

  rubric_strategies_order:
    - "context_passed"
    - "menu_scraping"
    - "archive_generation"
    - "nuxt_state_parsing"
    - "auto_detect_multi"
    - "pattern_fallback"

  author_strategies_order:
    - "meta_tag"
    - "class_selector"
    - "style_based"
    - "json_ld_graph"
    - "json_ld_simple"
    - "regex_in_content"
    - "priority_list"
    - "default_fallback"

  category_strategies_order:
    - "meta_tag"
    - "url_path_parsing"
    - "breadcrumb"
    - "default_fallback"
    - "context_passed"

reusable_strategies:
  rubric_sources:
    menu_scraping:
      enabled: true
      selectors:
        - "nav a[href]"
        - "header a[href]"
        - "ul a[href]"
        - "div.np-widget-rubric a[href]"
    archive_generation:
      enabled: true
      patterns:
        - "{base_url}/{year}/"
        - "{base_url}/{year}/{month:02d}/"
        - "{base_url}/{year}/{month:02d}/page/1/"
    context_passed:
      enabled: true
    nuxt_state_parsing:
      enabled: true
      script_patterns:
        - "__NUXT__"
        - "window.__NUXT__"
      url_regexes:
        - "https?://[^\"'\\s<>]+"
        - "/(?:news|rubric|category|tag|article|post|a)/[^\"'\\s<>]*"
      json_keys:
        - "path"
        - "href"
        - "url"
    auto_detect_multi:
      enabled: true
      steps:
        - "profile_specific_selectors"
        - "menu_scraping"
        - "pattern_fallback"
        - "nuxt_state_parsing"
    pattern_fallback:
      enabled: true
      href_patterns:
        - "/news/"
        - "/rubric/"
        - "/category/"
        - "/tag/"
        - "/section/"
        - "/archive/"

  author_sources:
    class_selector:
      enabled: true
      selectors:
        - ".author"
        - ".article-author"
        - ".byline"
        - ".by"
        - ".c-author"
        - ".c-author__content"
        - ".media-block__title--author"
        - ".post-author"
        - ".news-author"
        - ".main__author"
        - ".widget__author"
        - ".authors_3UWeo .item_1CuO-"
        - ".material-author"
        - ".author-name"
        - "span.author-name"
        - "a.date-widget__author"
        - ".post-meta .author vcard a"
        - ".post-meta .author"
        - ".entry-meta .author a"
        - ".author__name"
        - ".writer"
    style_based:
      enabled: true
      style_keywords:
        - "author"
        - "byline"
    meta_tag:
      enabled: true
      selectors:
        - 'meta[property="article:author"]'
        - 'meta[name="author"]'
        - 'meta[name="Author"]'
    regex_in_content:
      enabled: true
      patterns:
        - '(?:Author|By|From\\s+the\\s+author|Author|Prepared(?:by)?|Text\\s+author)\\s*[:\\-]?\\s*([A-Za-zА-Яа-яЁёӨөҮүҚқҒғҲҳӢӣЪъІіЇї\\''’\\-\\.\\s]{2,120})'
        - '(?:written\\s+by|reported\\s+by)\\s*[:\\-]?\\s*([A-Za-zА-Яа-яЁёӨөҮүҚқҒғҲҳӢӣЪъІіЇї\\''’\\-\\.\\s]{2,120})'
    json_ld_simple:
      enabled: true
      target_types:
        - "NewsArticle"
        - "Article"
        - "ReportageNewsArticle"
        - "BlogPosting"
    json_ld_graph:
      enabled: true
      target_types:
        - "NewsArticle"
        - "Article"
        - "ReportageNewsArticle"
        - "BlogPosting"
    priority_list:
      enabled: true
    default_fallback:
      enabled: true

  date_locale:
    tajik_months:
      "January": "January"
      "February": "February"
      "March": "March"
      "April": "April"
      "May": "May"
      "June": "June"
      "July": "July"
      "August": "August"
      "September": "September"
      "October": "October"
      "November": "November"
      "December": "December"

  category_sources:
    url_path_parsing:
      enabled: true
      patterns:
        - "/category/([^/]+)"
        - "/rubric/([^/]+)"
        - "/articles/([^/]+)/\\d{4}"
        - "/sections/([^/]+)/"
        - "/president-t/([^/]+)/"
        - "/uato/([^/]+)/"
        - "/alasao/([^/]+)/"
        - "/news/([^/]+)/"

