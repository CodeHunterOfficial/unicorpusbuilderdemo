# ============================================================
# GLOBAL DEFAULTS — shared settings, strategies, families
# ============================================================
version: "2.0"
name: "optimal_pipeline"
description: "Universal configurable scraper for multilingual news sites"
site_count_expected: 28

# ============================================================
# BASE SETTINGS
# ============================================================
global:
  start_url: "https://tatar-inform.tatar/"
  same_domain_only: true
  use_amp_fallback: true
  respect_robots: false
  colab_auto_download: false

  request:
    timeout: 25
    retries: 3
    backoff_base: 1.6
    default_delay_seconds: 1.2
    rubric_delay_range_seconds: [1.0, 2.2]
    max_threads: 8
    verify_ssl: true

  limits:
    max_depth: 3
    max_pages: 1000
    max_items: 10000
    excerpt_len: 260
    hash_truncate: 32

  url_rules:
    article_url_filters_default:
      - "/news/"
      - "/article/"
      - "/story/"
      - "/post/"
      - "/a/"
    article_url_excludes_default:
      - "/rubric/"
      - "/category/"
      - "/tag/"
      - "/widget/"
      - "/list/"
    noise_url_parts:
      - "/photo/"
      - "/video/"
      - "/special-projects/"
      - "/widget/"
      - "/tag/list/"
      - "vkvideo"
      - "youtube"
      - "youtu.be"
      - "instagram"
      - "facebook"
      - "telegram"
      - "ok.ru"
      - "/login"
      - "/signup"
      - "/signin"
      - "/register"
      - "/attachments/"
      - "/store/"
      - ".png"
      - ".jpg"
      - ".jpeg"
      - ".gif"
      - ".svg"
      - ".xml"
      - ".pdf"
      - ".zip"

  text_rules:
    normalize:
      lowercase: true
      trim: true
      remove_punctuation: false

    language_detection:
      enabled: true
      fallback: "unknown"

    filters:
      min_word_length: 2
      remove_numeric_only: true
      drop_if_only_noise: true
      min_text_length: 20
      deduplicate_lines: true

    patterns:
      ui_patterns:
        - "читать.*"
        - "read.*"
        - "show.*"
        - "load.*"
      ad_patterns:
        - "advert"
        - "promo"
        - "sponsor"

  content_cleanup:
    remove_selectors:
      - "script"
      - "style"
      - "noscript"
      - "iframe"
      - "svg"
      - "form"
      - "button"
      - "canvas"

  meta_extraction:
    title_selectors_default:
      - 'meta[property="og:title"]'
      - 'meta[name="twitter:title"]'
      - "h1"
      - "title"
    date_selectors_default:
      - 'meta[property="article:published_time"]'
      - 'meta[name="pubdate"]'
      - 'meta[name="published_date"]'
      - 'meta[itemprop="datePublished"]'
      - 'meta[name="published_at"]'
      - "time[datetime]"
    author_selectors_default:
      - 'meta[property="article:author"]'
      - 'meta[name="author"]'
      - 'meta[name="Author"]'
    category_selectors_default:
      - 'meta[property="article:section"]'
      - 'meta[name="section"]'
      - ".breadcrumb a"
      - "nav.breadcrumb a"
    image_selectors_default:
      - 'meta[property="og:image"]'
      - 'meta[property="og:image:secure_url"]'
      - 'meta[name="twitter:image"]'
      - 'meta[name="twitter:image:src"]'

  rubric_strategies_order:
    - "context_passed"
    - "menu_scraping"
    - "archive_generation"
    - "nuxt_state_parsing"
    - "auto_detect_multi"
    - "pattern_fallback"

  author_strategies_order:
    - "meta_tag"
    - "class_selector"
    - "style_based"
    - "json_ld_graph"
    - "json_ld_simple"
    - "regex_in_content"
    - "priority_list"
    - "default_fallback"

  category_strategies_order:
    - "meta_tag"
    - "url_path_parsing"
    - "breadcrumb"
    - "default_fallback"
    - "context_passed"

# ============================================================
# STRATEGY LIBRARY
# ============================================================
reusable_strategies:

  rubric_sources:
    menu_scraping:
      enabled: true
      selectors:
        - "nav a[href]"
        - "header a[href]"
        - "ul a[href]"
        - "div.np-widget-rubric a[href]"
    archive_generation:
      enabled: true
      patterns:
        - "{base_url}/{year}/"
        - "{base_url}/{year}/{month:02d}/"
        - "{base_url}/{year}/{month:02d}/page/1/"
    context_passed:
      enabled: true
    nuxt_state_parsing:
      enabled: true
      script_patterns:
        - "__NUXT__"
        - "window.__NUXT__"
      url_regexes:
        - "https?://[^\"'\\s<>]+"
        - "/(?:news|rubric|category|tag|article|post|a)/[^\"'\\s<>]*"
      json_keys:
        - "path"
        - "href"
        - "url"
    auto_detect_multi:
      enabled: true
      steps:
        - "profile_specific_selectors"
        - "menu_scraping"
        - "pattern_fallback"
        - "nuxt_state_parsing"
    pattern_fallback:
      enabled: true
      href_patterns:
        - "/news/"
        - "/rubric/"
        - "/category/"
        - "/tag/"
        - "/section/"
        - "/archive/"

  author_sources:
    class_selector:
      enabled: true
      selectors:
        - ".author"
        - ".article-author"
        - ".byline"
        - ".by"
        - ".c-author"
        - ".c-author__content"
        - ".media-block__title--author"
        - ".post-author"
        - ".news-author"
        - ".main__author"
        - ".widget__author"
        - ".authors_3UWeo .item_1CuO-"
        - ".material-author"
        - ".author-name"
        - "span.author-name"
        - "a.date-widget__author"
        - ".post-meta .author vcard a"
        - ".post-meta .author"
        - ".entry-meta .author a"
        - ".author__name"
        - ".writer"
    style_based:
      enabled: true
      style_keywords:
        - "author"
        - "byline"
    meta_tag:
      enabled: true
      selectors:
        - 'meta[property="article:author"]'
        - 'meta[name="author"]'
        - 'meta[name="Author"]'
    regex_in_content:
      enabled: true
    json_ld_simple:
      enabled: true
      target_types:
        - "NewsArticle"
        - "Article"
        - "ReportageNewsArticle"
        - "BlogPosting"
    json_ld_graph:
      enabled: true
      target_types:
        - "NewsArticle"
        - "Article"
        - "ReportageNewsArticle"
        - "BlogPosting"
    priority_list:
      enabled: true
    default_fallback:
      enabled: true

  category_sources:
    url_path_parsing:
      enabled: true
      patterns:
        - "/category/([^/]+)"
        - "/rubric/([^/]+)"
        - "/articles/([^/]+)/\\d{4}"
        - "/bahsho/([^/]+)/"
        - "/prezidenti-t/([^/]+)/"
        - "/uato/([^/]+)/"
        - "/alasao/([^/]+)/"
        - "/news/([^/]+)/"

# ============================================================
# DEFAULT PROFILE — auto-detection + fallback selectors
# ============================================================
default_profile:
  default_author: null
  default_language: null
  cookie_lang: null
  amp_mode: "none"
  verify_ssl: true
  noise_language: ["common", "ru"]

  auto_detect_family:
    enabled: true
    scan_pages: 3
    confidence_threshold: 2
    families:

      np_widget:
        indicators:
          - selector: "div.np-widget-rubric"
            weight: 3
          - selector: "div.page-main__text"
            weight: 2
          - selector: "li.newsList__item"
            weight: 2
          - selector: "li.all-news__list"
            weight: 2
          - url_pattern: "/news/rubric/list/"
            weight: 2
        match_min_score: 4
        profile:
          rubric_selectors:
            - "div.np-widget-rubric a[href]"
            - "a.main-menu__link[href*='/news/rubric/']"
            - "a.menu-list__link[href*='/news/rubric/list/']"
            - "a[href*='/news/rubric/list/']"
            - "nav a[href*='/news/']"
          card_selectors:
            - "li.newsList__item"
            - "li.all-news__list"
            - "li.tm-news-list__item"
            - "ul.list li.list__item"
            - "li.news-list__item"
          card_exclude_classes: ["banner", "_more", "ad"]
          article_link_selectors:
            - "a.newsList__item-text"
            - "a.all-news__list__link"
            - "a.tm-news-list__item-link"
            - "a.list__link"
            - "a.news-list__link"
          title_selectors:
            - "h1.main__news-title"
            - "h1.single-page__title"
            - "h1.single__title"
            - 'meta[property="og:title"]'
            - "h1"
            - "title"
          date_selectors:
            - "a.main__date"
            - "time.news__item-date"
            - "span.list__date"
            - 'meta[property="article:published_time"]'
            - 'meta[itemprop="datePublished"]'
            - "time[datetime]"
          author_selectors:
            - ".single__author"
            - ".main__author"
            - 'meta[property="article:author"]'
            - 'meta[name="author"]'
          category_selectors:
            - "a.main__rubric"
            - "span.tm-news-list__item-rubric"
            - 'meta[property="article:section"]'
          content_selectors:
            - "div.page-main__text"
            - "div.single-page__content"
            - "div.single__content"
            - "div.news-main-container__paragraph"
          remove_selectors:
            - ".news__telegram__text"
            - ".np-news-single__aftertext"
            - ".widget-any-content"
            - ".main__icons"
            - ".widget-stat"
          pagination_selectors:
            - "ul.pagination a"
            - "a.next"
            - "a:contains('Next')"
            - "link[rel='next']"
            - "a[href*='/page/']"
            - "a[href*='page=']"
          article_url_filters: ["/news/"]
          article_url_excludes:
            - "/news/rubric/list/"
            - "/news/widget/list/"
            - "/news/date/list/"
            - "/photo/"
            - "/video/"
            - "/page/"
            - "/upload/"
            - "/projects/"
            - "/stories/"
            - "/editions/"
            - "/gallery/"
            - "/authors/"
            - "/persons/"
            - "/blogs/"
            - ".jpg"
            - ".png"
            - ".pdf"

      wordpress:
        indicators:
          - selector: "div.entry-content"
            weight: 3
          - selector: "article.post"
            weight: 2
          - selector: "ul.page-numbers"
            weight: 2
          - url_pattern: "/category/"
            weight: 2
          - url_pattern: "/wp-content/"
            weight: 3
        match_min_score: 4
        profile:
          rubric_selectors:
            - "nav a[href]"
