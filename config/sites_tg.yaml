# ============================================================
# TAJIK SITES
# ============================================================

sites:
  # ============================================================
  # sssr.tj — WordPress-based news
  # ============================================================
  sssr:
    match:
      - "sssr.tj"
    default_language: "tg"
    noise_language: ["common", "tg"]
    rubric_strategy:
      - "menu_scraping"
    author_strategy:
      - "meta_tag"
      - "json_ld_graph"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "ul#menu-primary-menu a[href*='/category/']"
      - "nav a[href*='/category/']"
      - "a[href*='/category/']"
      - "a[href*='/rubric/']"
      - "a[href*='/2021/']"
      - "a[href*='/2022/']"
      - "a[href*='/2023/']"
      - "a[href*='/2024/']"
      - "a[href*='/2025/']"
      - "a[href*='/2026/']"
    card_selectors:
      - "article.post"
    article_link_selectors:
      - "h2.entry-title a"
      - "article.post a[href]"
    pagination_selectors:
      - "a.next.page-numbers"
      - "ul.page-numbers a"
      - "a.page-numbers:not(.prev):not(.next)"
      - "a:contains('Next')"
      - "a.next"
      - "a[rel='next']"
      - "a[href*='/page/']"
      - "a[href*='page=']"
    title_selectors:
      - "h1.entry-title"
      - "h1"
      - "title"
      - 'meta[property="og:title"]'
    date_selectors:
      - 'meta[property="article:published_time"]'
      - 'meta[itemprop="datePublished"]'
      - ".post-meta .meta-date a time"
      - ".post-meta .meta-date"
      - "time[datetime]"
    author_selectors:
      - 'meta[name="author"]'
      - 'meta[property="article:author"]'
      - ".post-meta .author vcard a"
      - ".post-meta .author"
    category_selectors:
      - 'meta[property="article:section"]'
      - ".cat-links a"
      - ".breadcrumb a"
    content_selectors:
      - "div.entry-content"
      - "article"
    remove_selectors:
      - ".share"
      - ".social"
      - ".banner"
      - "script"
      - "style"
      - "noscript"
    article_url_filters: []
    article_url_excludes:
      - "/category/"
      - "/rubric/"
      - "/tag/"
      - "/page/"

  # ============================================================
  # ozodi.org — Tajik service of RFE/RL
  # ============================================================
  ozodi:
    match:
      - "ozodi.org"
    amp_mode: "prefix"
    default_language: "tg"
    noise_language: ["common", "tg"]
    rubric_strategy:
      - "menu_scraping"
    author_strategy:
      - "meta_tag"
      - "json_ld_graph"
      - "class_selector"
      - "default_fallback"
    rubric_selectors:
      - "ul.main-nav__list a[href]"
      - "li.accordeon__item a[href]"
    card_selectors:
      - "ul.archive-list li"
    article_link_selectors:
      - "a[href*='/a/']"
    pagination_selectors:
      - "a.btn.link-showMore"
    title_selectors:
      - "h1"
      - 'meta[property="og:title"]'
      - "title"
    date_selectors:
      - 'meta[property="article:published_time"]'
      - 'meta[name="pubdate"]'
      - 'meta[itemprop="datePublished"]'
      - "time[datetime]"
    author_selectors:
      - 'meta[name="Author"]'
      - ".c-author a"
      - ".media-block__title--author a"
    category_selectors:
      - 'meta[property="article:section"]'
      - ".category"
      - ".tag"
    content_selectors:
      - ".article-body"
      - "article"
      - ".content"
      - "main"
    remove_selectors:
      - ".banner"
      - ".share"
      - ".social"
      - ".widget"
      - ".sidebar"
    article_url_filters:
      - "/a/"
    article_url_excludes: []

  # ============================================================
  # asiaplus.news — Asia-Plus, Tajik edition
  # ============================================================
  asiaplus:
    match: ["asiaplus.news"]
    default_language: tg
    date_locale: "tg"
    start_url: "https://asiaplus.news/tg/hamai-ahbor/"
    verify_ssl: true

    title_selectors:
      - "h1.ap-single__title"
      - "meta[property='og:title']"

    date_selectors:
      - "meta[property='article:published_time']"
      - "meta[property='og:updated_time']"
      - "dl.ap-single__facts time[datetime]"

    author_selectors:
      - "a.ap-author__link"
      - "meta[name='twitter:data1']"

    content_selectors:
      - "div.ap-content.entry-content"

    category_selectors:
      - "meta[property='article:section']"

    card_selectors:
      - "div.ap-grid--2 article.ap-card"
      - "div.ap-biggrid article.ap-card"
      - "div.ap-archive__main article.ap-card"

    article_link_selectors:
      - "h2.ap-card__title a"
      - "h3.ap-card__title a"

    pagination_selectors:
      - "nav.ap-arch-nav a.next"
      - "link[rel='next']"

    article_url_regex: "^/tg/\\d{4}/\\d{2}/\\d{2}/[^/]+/?$"
    article_url_filters:
      - "/tg/2026/"
      - "/tg/2025/"
      - "/tg/2024/"
      - "/tg/2023/"
    article_url_excludes:
      - "/category/"
      - "/author/"
      - "/tag/"
      - "/page/"

    category_strategy:
      - meta_tag

    author_strategy:
      - class_selector
      - meta_tag
      - regex_in_content

  # ============================================================
  # khovar.tj — national information agency of Tajikistan
  # ============================================================
  khovar:
    match: ["khovar.tj"]
