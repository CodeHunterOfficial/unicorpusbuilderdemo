  # ============================================================
  # president.tj — API-driven presidential press service
  # ============================================================
  president-tj:
    match:
      - "president.tj"
    default_language: "tg"
    noise_language: ["common", "tg"]
    default_author: "Presidential Press Service"
    api_source:
      enabled: true
      base_api_url: "https://controlpanel.president.tj"
      site_url: "https://www.president.tj"
      list_endpoint: "/api/event_search_by_group?event_type=news&page={page}&searchText=&lang_id=1"
      fixed_last_page: 1211
      items_path: "data"
      field_map:
        id: "id"
        title: "title"
        date: ["publish_date", "news_date", "date"]
        content_html: "text"
        url_template: "{site_url}/event/news/{id}"
      nested_extraction:
        images:
          path: "news_flickr_image_relation"
          key: "src"
        categories:
          path: "news_type_relation"
          key: "news_type.name"
        cities:
          path: "city_relation"
          key: "city.name"
      delay: 0.15
      headers:
        User-Agent: "Mozilla/5.0 (compatible; Scraper/1.0)"
        Accept: "application/json, text/plain, */*"
        Accept-Language: "ru-RU,ru;q=0.9,en;q=0.8,tg;q=0.7"

