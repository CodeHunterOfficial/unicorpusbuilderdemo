      - "div.author .meta"
      - "span.meta"

    author_selectors:
      - "p[style*='text-align: right'] strong"
      - "div.author strong"

    content_selectors:
      - "div.column9"
      - "div.shortcode-content"

    category_selectors:
      - "meta[property='article:section']"

    card_selectors:
      - "div.article-big"
      - "div.news-item"
      - "article"

    article_link_selectors:
