      - "h3 a"

    pagination_selectors:
      - "div.pagination a.next"
      - "div.pagination a:contains('Саҳифаи оянда')"
      - "a[rel='next']"

    rubric_selectors:
      - "div.main-menu ul.the-menu a[href*='/category/']"

    article_url_regex: "^/\\d{4}/\\d{2}/[^/]+/?$"
    article_url_filters:
      - "/2026/"
      - "/2025/"
      - "/2024/"
      - "/2023/"
    article_url_excludes:
      - "/category/"
      - "/tag/"
      - "/page/"

    category_strategy:
      - meta_tag
      - url_path_parsing

    author_strategy:
      - class_selector
      - meta_tag
      - regex_in_content

