    default_language: "tg"
    noise_language: ["common", "tg"]
    start_url: "https://oila.tj/category/khavodis"
    verify_ssl: true

    rubric_strategy:
      - "menu_scraping"
      - "context_passed"

    rubric_selectors:
      - "ul.menu-desk a[href*='/category/']"
      - "nav a[href*='/category/']"

    article_url_regex: "^/news/[a-z0-9-]+/?$"

    article_url_excludes:
      - "/news/search"
      - "/news/user/"
      - "/wishlist"
      - "/category/"

    card_selectors:
      - "div.article"

    article_link_selectors:
      - "a.article__title"
      - "a.article__img"

    pagination_selectors:
      - "a[rel='next']"
      - ".pagination a"
      - "a[href*='?page=']"

    title_selectors:
      - "meta[property='og:title']"
      - "div.title--article"
      - "h1"
      - "title"

    date_selectors:
      - "div.date-widget__time"
      - "meta[property='article:published_time']"
      - "time[datetime]"

    author_strategy:
      - "meta_tag"

    author_selectors:
      - "meta[name='author']"
      - "meta[property='article:author']"

    author_blacklist:
      - "Оила"
      - "oila.tj"

    category_strategy:
      - "context_passed"
      - "url_path_parsing"

    content_selectors:
      - "article.page-article__wysiwyg"
      - "article.wysiwyg"

    remove_selectors:
      - "div.similar-block"
      - "div.page-article__stat"
      - "div.date-widget"
      - "picture"
      - "header"
      - "footer"
      - "nav"
      - "aside"
      - ".header-desk"
      - ".mobile-menu-wrap"
      - ".section--desk-header"
      - ".section--header"
      - ".show-more"
      