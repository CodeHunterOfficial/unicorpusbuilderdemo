# ============================================================
# TAJIK SITES — 10 news portals in Tajik language
# ============================================================

sites:
  # ============================================================
  # sssr.tj — WordPress-based news
  # ============================================================
  sssr:
    match:
      - "sssr.tj"
    default_language: "tg"
    noise_language: ["common", "tg"]
    rubric_strategy:
      - "menu_scraping"
    author_strategy:
      - "meta_tag"
      - "json_ld_graph"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "ul#menu-primary-menu a[href*='/category/']"
      - "nav a[href*='/category/']"
      - "a[href*='/category/']"
      - "a[href*='/rubric/']"
      - "a[href*='/2021/']"
      - "a[href*='/2022/']"
      - "a[href*='/2023/']"
      - "a[href*='/2024/']"
      - "a[href*='/2025/']"
      - "a[href*='/2026/']"
    card_selectors:
      - "article.post"
    article_link_selectors:
      - "h2.entry-title a"
      - "article.post a[href]"
    pagination_selectors:
      - "a.next.page-numbers"
      - "ul.page-numbers a"
      - "a.page-numbers:not(.prev):not(.next)"
      - "a:contains('Next')"
      - "a.next"
      - "a[rel='next']"
      - "a[href*='/page/']"
      - "a[href*='page=']"
    title_selectors:
      - "h1.entry-title"
      - "h1"
      - "title"
      - 'meta[property="og:title"]'
    date_selectors:
      - 'meta[property="article:published_time"]'
      - 'meta[itemprop="datePublished"]'
      - ".post-meta .meta-date a time"
      - ".post-meta .meta-date"
      - "time[datetime]"
    author_selectors:
      - 'meta[name="author"]'
      - 'meta[property="article:author"]'
      - ".post-meta .author vcard a"
      - ".post-meta .author"
    category_selectors:
      - 'meta[property="article:section"]'
      - ".cat-links a"
      - ".breadcrumb a"
    content_selectors:
      - "div.entry-content"
      - "article"
    remove_selectors:
      - ".share"
      - ".social"
      - ".banner"
      - "script"
      - "style"
      - "noscript"
    article_url_filters: []
    article_url_excludes:
      - "/category/"
      - "/rubric/"
      - "/tag/"
      - "/page/"

