# ============================================================
# BASHKIR SITES — 2 news portals in Bashkir language
# ============================================================

sites:

  # ============================================================
  # yanshishma.com — Nuxt-based Bashkir news
  # ============================================================
  yanshishma:
    match:
      - "yanshishma.com"
    default_language: "ba"
    noise_language: ["common", "ba"]
    rubric_strategy:
      - "nuxt_state_parsing"
      - "menu_scraping"
      - "pattern_fallback"
    author_strategy:
      - "json_ld_graph"
      - "json_ld_simple"
      - "meta_tag"
      - "class_selector"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "nav a[href]"
      - "header a[href]"
      - "a[href*='/articles/']"
      - "a[href*='/category/']"
      - "a[href*='/news/']"
    card_selectors:
      - "article"
    article_link_selectors:
      - "a[href*='/articles/']"
      - "a[href]"
    pagination_selectors:
      - "a.btn.link-showMore"
      - "a.load-more"
      - "a.show-more"
      - "a.pagination__next"
      - "a:contains('Күберәк')"
      - "a.next"
      - "a[rel='next']"
      - "a[href*='page=']"
      - "a[href*='/page/']"
    title_selectors:
      - "h1"
      - "title"
      - 'meta[property="og:title"]'
    date_selectors:
      - 'meta[property="article:published_time"]'
      - 'meta[name="published_at"]'
      - 'meta[itemprop="datePublished"]'
      - "time[datetime]"
      - "[class*='date']"
    author_selectors:
      - 'meta[name="author"]'
      - 'meta[property="article:author"]'
      - "[class*='_authors_'] [class*='_item_']"
      - "[class*='_authors_']"
      - "[class*='author']"
      - ".material-author"
    category_selectors:
      - 'meta[property="article:section"]'
      - ".breadcrumb a"
    content_selectors:
      - ".paragraph.serif-text"
      - ".material-content"
      - ".news-text"
      - "[itemprop='articleBody']"
      - ".field-item"
      - ".post-content"
      - "article"
      - ".entry-content"
      - ".content"
      - "main"
    remove_selectors:
      - ".banner"
      - ".social"
      - ".share"
      - ".widget"
    article_url_filters:
      - "/articles/"
    article_url_excludes:
      - "/galleries/"
      - "/category/"
      - "/tag/"
      

  # ============================================================
  # akbuzat-rb.ru — Nuxt-based Bashkir news
  # ============================================================
  akbuzat:
    match:
      - "akbuzat-rb.ru"
    default_language: "ba"
    noise_language: ["common", "ba", "ru"]
    start_url: "https://akbuzat-rb.ru/"
    rubric_strategy:
      - "nuxt_state_parsing"
      - "pattern_fallback"
    author_strategy:
      - "json_ld_graph"
      - "json_ld_simple"
      - "class_selector"
      - "meta_tag"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "nav a[href]"
      - "header a[href]"
      - "a[href*='/articles/']"
      - "a[href*='/news/']"
    card_selectors:
      - "a[class*='_item_'][href*='/news/']"
      - "a[class*='_item_'][href*='/articles/']"
      - "div[class*='_items-block_'] a[href]"
      - "article"
    article_link_selectors:
      - "a[class*='_item_'][href*='/news/']"
      - "a[class*='_item_'][href*='/articles/']"
      - "a[href*='/articles/']"
      - "a[href*='/news/']"
    pagination_selectors:
      - "a.load-more"
      - "a.show-more"
      - "a.pagination__next"
      - "a:contains('Күберәк')"
      - "a.next"
      - "a[rel='next']"
      - "a[href*='page=']"
      - "a[href*='/page/']"
    title_selectors:
      - "h1"
      - 'meta[property="og:title"]'
      - "title"
    date_selectors:
      - "div.cm-date"
      - "[class*='_rubricDate_'] .cm-date"
      - 'meta[property="article:published_time"]'
      - 'meta[name="published_at"]'
      - 'meta[name="pubdate"]'
      - 'meta[itemprop="datePublished"]'
      - "time[datetime]"
      - "[class*='_date_']"
      - "[class*='date']"
    author_selectors:
      - "[class*='_authors_'] [class*='_item_']"
      - "[class*='_authors_'] span"
      - 'meta[name="author"]'
      - 'meta[name="Author"]'
      - 'meta[property="article:author"]'
      - "[class*='_authors_']"
      - "[class*='author']"
      - ".material-author"
      - ".article-author"
      - ".byline"
    category_selectors:
      - "a.cm-rubric"
      - "[class*='_rubricDate_'] a.cm-rubric"
      - 'meta[property="article:section"]'
      - ".breadcrumb a"
      - ".rubric"
      - ".category"
      - "[class*='rubric']"
    content_selectors:
      - "section.cols > div"
      - "section.cols"
      - "[class*='_block_']"
      - ".serif-text"
      - "article"
      - "main"
    remove_selectors:
      - "script"
      - "style"
      - "noscript"
      - "iframe"
      - ".banner"
      - ".social"
      - ".share"
      - ".widget"
      - "[class*='_topBanner_']"
      - "[class*='_authors_']"
      - "[class*='_readus_']"
      - "[class*='_socials_']"
      - "[class*='_photoText_']"
      - "[class*='_blockTitle_']"
      - "[class*='_gallery_']"
      - "[class*='_thumbs_']"
      - "[class*='_teaserItem_']"
      - "[class*='_partners']"
      - "[class*='_footer']"
      - "[class*='_contacts_']"
      - ".swiper-container"
      - ".swiper-wrapper"
      - ".swiper-slide"
    article_url_filters: []
    article_url_excludes:
      - "/rubric/"
      - "/category/"
      - "/tag/"
      - "/author/"
      - "/page/"
      - "/feed/"
      - ".jpg"
      - ".png"
      - ".pdf"