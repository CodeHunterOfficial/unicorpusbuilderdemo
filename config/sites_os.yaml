# config/sites_os.yaml
# ============================================================
# OSSETIAN SITES
# ============================================================
sites:

  # ============================================================
  # iryston.tv — Ossetian news & teleproject portal
  # ============================================================
  iryston:
    match:
      - "iryston.tv"
    default_language: "os"
    noise_language: ["common", "os"]
    start_url: "https://iryston.tv/ir/sairag/"
    rubric_strategy:
      - "menu_scraping"
      - "pattern_fallback"
    author_strategy:
      - "meta_tag"
      - "class_selector"
      - "json_ld_graph"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "ul.menu__list a[href]"
      - "a[href*='/ir/habaerttae']"
      - "a[href*='/ir/iz-efira-os']"
      - "a[href*='/ir/vsya-afisha-os']"
      - "a[href='/ir/sairag']"
    card_selectors:
      - "div.news-item"
      - "article.post"
      - "div.teleproject-item"
      - "div.news-item__img-block"
    article_link_selectors:
      - "a.news-item__title[href]"
      - "a.news-item__img-block[href]"
      - "h2.news-item__title a"
      - "a[href*='/ir/']"
    pagination_selectors:
      - "link[rel='next']"
      - "a.next"
      - "a.page-numbers"
      - "a[href*='/page/']"
      - "a.loadmoreNews"
      - "a.loadmoreEfir"
    title_selectors:
      - "h1.news-single__title"
      - "h1.teleproject-single__title"
      - 'meta[property="og:title"]'
      - "title"
    date_selectors:
      - 'meta[property="article:published_time"]'
      - ".news-single__date"
      - ".teleproject-single__date"
      - "time[datetime]"
      - "time"
    author_selectors:
      - ".news-single__author a"
      - ".teleproject-single__author a"
      - 'meta[name="author"]'
      - ".entry-author a"
    category_selectors:
      - 'meta[property="article:section"]'
      - ".breadcrumb__item:nth-last-child(2) a"
      - ".breadcrumb__item a"
    content_selectors:
      - ".content"
      - ".teleproject-single__block .content"
      - ".news-single__block"
      - "article"
      - "main"
    remove_selectors:
      - "script"
      - "style"
      - "noscript"
      - "iframe"
      - ".social-likes"
      - ".evc-social-likes"
      - ".share"
      - ".banner"
      - ".advertisement"
      - "form"
    article_url_filters:
      - "/ir/"
      - "/teleproject_release/"
    article_url_excludes:
      - "/page/"
      - "/category/"
      - "/tag/"
      - "/author/"
      - "/feed/"
      - "/ir/sairag"
      - "/ir/habaerttae"
      - "/ir/iz-efira-os"
      - "/ir/vsya-afisha-os"
      - "/wp-admin/"
      - ".jpg"
      - ".png"
      - ".pdf"

