# ============================================================
# TATAR SITES — 13 news portals in Tatar language
# ============================================================
sites:

  # ============================================================
  # tatar-inform.tatar — flagship Tatar news agency
  # ============================================================
  tatar-inform:
    match:
      - "tatar-inform.tatar"
    default_author: "Tatar-inform"
    default_language: "tt"
    noise_language: ["common", "tt"]
    rubric_strategy:
      - "menu_scraping"
      - "pattern_fallback"
    author_strategy:
      - "meta_tag"
      - "json_ld_graph"
      - "json_ld_simple"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "div.np-widget-rubric a[href]"
      - "ul.menu a[href*='/news/']"
      - "nav a[href*='/news/']"
      - "a[href*='/news/rubric/list/']"
      - "a[href*='/news/']"
    card_selectors:
      - "li.newsList__item"
      - "li.all-news__list"
    card_exclude_classes: ["banner", "_more"]
    article_link_selectors:
      - "a.newsList__item-text[href]"
      - "a.all-news__list__link[href]"
    pagination_selectors:
      - "a.next"
      - "link[rel='next']"
      - "ul.pagination a[href*='page=']"
      - "ul.pagination a[href*='/page/']"
      - "a[href*='page=']"
      - "a[href*='/page/']"
    title_selectors:
      - "h1.main__news-title"
      - "h1"
      - "title"
    date_selectors:
      - "a.main__date"
      - 'meta[property="article:published_time"]'
      - 'meta[itemprop="datePublished"]'
      - 'meta[name="published_date"]'
      - "time[datetime]"
    author_selectors:
      - 'meta[property="article:author"]'
      - 'meta[name="author"]'
      - 'meta[name="Author"]'
      - ".main__author"
    category_selectors:
      - "a.main__rubric"
      - 'meta[property="article:section"]'
      - 'meta[name="section"]'
    category_strategy:
      - "meta_tag"
    content_selectors:
      - "div.page-main__text"
      - "main"
      - "article"
    remove_selectors:
      - ".news__telegram__text"
      - ".np-news-single__aftertext"
      - ".banner"
      - ".widget"
    article_url_filters:
      - "/news/"
    article_url_excludes:
      - "/news/rubric/list/"
      - "/news/widget/list/"
      - "/photo/widget/list/"
      - "/video/widget/list/"
      - "/special-projects/widget/list/"

