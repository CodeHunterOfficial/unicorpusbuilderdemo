      - "almet-rt.ru"
    default_author: "Tuganaylar"
    default_language: "tt"
    noise_language: ["common", "tt"]
    cookie_lang: "tt"
    rubric_strategy:
      - "auto_detect_multi"
      - "pattern_fallback"
    author_strategy:
      - "meta_tag"
      - "json_ld_graph"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "div.np-widget-rubric a[href]"
      - ".widget a[href*='/news/rubric/list/']"
      - "a[href*='/news/rubric/list/']"
    card_selectors:
      - "ul.all-news__section_ul li.all-news__list"
      - "li.all-news__list"
    article_link_selectors:
      - "a.all-news__list__link[href]"
      - "a[href*='/news/']"
    pagination_selectors:
      - "a.next"
      - "link[rel='next']"
      - "a:contains('Next')"
      - "a[href*='/page/']"
    title_selectors:
      - "h1"
      - "title"
    date_selectors:
      - 'meta[property="article:published_time"]'
      - 'meta[itemprop="datePublished"]'
      - 'meta[name="published_date"]'
      - "time[datetime]"
    author_selectors:
      - 'meta[property="article:author"]'
      - 'meta[name="author"]'
    category_selectors:
      - 'meta[property="article:section"]'
    category_strategy:
      - "meta_tag"
    content_selectors:
      - "div.news-main-container__paragraph"
      - "main"
      - "article"
    remove_selectors:
      - ".news__telegram__text"
      - ".np-news-single__aftertext"
    article_url_filters:
      - "/news/"
    article_url_excludes:
      - "/news/rubric/list/"
      - "/page/"

  # ============================================================
  # azatliq.org — Tatar service of RFE/RL
  # ============================================================
  azatliq:
    match:
      - "azatliq.org"
    amp_mode: "prefix"
    default_language: "tt"
    noise_language: ["common", "tt"]
    rubric_strategy:
      - "menu_scraping"
      - "pattern_fallback"
    author_strategy:
      - "meta_tag"
      - "class_selector"
      - "json_ld_graph"
      - "regex_in_content"
      - "default_fallback"
    rubric_selectors:
      - "ul.main-nav__list a[href]"
      - "nav a[href]"
      - "header a[href]"
      - "a[href*='/s/']"
      - "a[href*='/topic/']"
    card_selectors:
      - "ul.archive-list li"
    article_link_selectors:
      - "a[href*='/a/']"
    pagination_selectors:
      - "a.btn.link-showMore"
      - "a.load-more"
      - "a.show-more"
      - "a:contains('More')"
      - "a[rel='next']"
      - "a[href*='p=']"
    title_selectors:
      - "h1"
      - "title"
      - 'meta[property="og:title"]'
    date_selectors:
      - 'meta[property="article:published_time"]'
      - 'meta[name="pubdate"]'
      - 'meta[itemprop="datePublished"]'
      - "time[datetime]"
    author_selectors:
      - 'meta[name="Author"]'
      - 'meta[name="author"]'
      - ".c-author"
      - ".c-author__content"
      - ".media-block__title--author"
    category_selectors:
      - 'meta[property="article:section"]'
      - ".category"
      - ".tag"
    content_selectors:
      - "article"
      - ".article-body"
      - ".content"
      - "main"
    remove_selectors:
      - ".banner"
      - ".social"
      - ".share"
      - ".cookie"
      - ".widget"
      - ".sidebar"
    article_url_filters:
      - "/a/"
    article_url_excludes: []

