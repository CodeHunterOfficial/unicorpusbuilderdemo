# ============================================================
# Document parser configuration
# ============================================================
version: "1.0"
description: "Universal document parser configuration"

supported_extensions:
  text:
    extensions: [".txt", ".csv", ".tsv", ".md", ".rst", ".log", ".json", ".xml", ".html", ".htm", ".yaml", ".yml", ".ini", ".cfg", ".py", ".js", ".css", ".sql"]
    type: "text"
    
  pdf:
    extensions: [".pdf"]
    type: "pdf"
    
  word:
    extensions: [".docx", ".doc", ".odt", ".rtf"]
    type: "docx"
    
  spreadsheet:
    extensions: [".xlsx", ".xls", ".ods"]
    type: "xlsx"
    
  presentation:
    extensions: [".pptx", ".ppt", ".odp"]
    type: "pptx"
    
  ebook:
    extensions: [".epub", ".mobi", ".fb2", ".azw", ".azw3"]
    type: "ebook"
    
  image_ocr:
    extensions: [".png", ".jpg", ".jpeg", ".tiff", ".tif", ".bmp", ".gif", ".webp"]
    type: "image"
    
  archive:
    extensions: [".zip", ".rar", ".7z", ".tar", ".gz", ".bz2"]
    type: "archive"

filename_parsing:
  separators: ["_", " - ", "-"]
  author_first: true

rubric_parsing:
  depth: 0
  ignore_root: true

text_reading:
  encodings: ["utf-8", "utf-8-sig", "windows-1251", "cp1251", "koi8-r", "latin-1", "iso-8859-1", "cp866", "maccyrillic"]

ocr:
  languages: "rus+eng+tat+ara"
  min_width: 100
  min_height: 100

processing:
  max_file_size_mb: 100
  min_text_length: 100
  skip_empty: true
  recursive_archives: true
  max_archive_depth: 3

output:
  directory: "output/documents"
  filename_template: "documents_{timestamp}.jsonl"
  save_all: true

text_cleaning:
  normalize_whitespace: true
  min_line_length: 20
  remove_numeric_only: false
  strip_html: true

language:
  auto_detect: true
  default: "unknown"

defaults:
  author: null
  category: null
  language: null
  site: "local_documents"
  source_type: "document"